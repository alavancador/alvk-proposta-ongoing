<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#050d1c">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Propostas Comerciais | ALVK</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        background: #050d1c;
        color: #fff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background:
          radial-gradient(circle at 80% 12%, rgba(18, 91, 255, 0.24), transparent 35%),
          linear-gradient(145deg, #050d1c 0%, #07152b 58%, #0d2140 100%);
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      .card {
        width: min(680px, 100%);
        padding: clamp(32px, 7vw, 64px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 28px;
        background: rgba(7, 21, 43, 0.72);
        box-shadow: 0 32px 100px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(18px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 56px;
      }

      .brand__mark {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 11px;
        background: #125bff;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .brand__name {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: #7fa8ff;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 540px;
        margin: 0;
        font-size: clamp(36px, 7vw, 64px);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      p:not(.eyebrow) {
        max-width: 520px;
        margin: 24px 0 0;
        color: #aebbd0;
        font-size: clamp(16px, 2vw, 19px);
        line-height: 1.65;
      }

      @media (max-width: 560px) {
        main {
          padding: 16px;
        }

        .card {
          border-radius: 22px;
        }

        .brand {
          margin-bottom: 44px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="page-title">
        <div class="brand" aria-label="ALVK">
          <span class="brand__mark" aria-hidden="true">AΛ</span>
          <span class="brand__name">ALVK</span>
        </div>
        <p class="eyebrow">Ambiente de propostas</p>
        <h1 id="page-title">Cada projeto tem um endereço exclusivo.</h1>
        <p>Para acessar sua proposta, utilize o link completo enviado pela equipe ALVK.</p>
      </section>
    </main>
  </body>
</html>
